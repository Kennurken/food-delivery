{% extends "base.html" %}

{% block content %}
<section class="wrap block narrow">
  <h1>{{ _("Регистрация") }}</h1>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="/register/" class="form">
    <input type="hidden" name="next" value="{{ next }}">
    <label>{{ _("Имя") }}
      <input type="text" name="name" value="{{ name or '' }}" required autocomplete="name">
    </label>
    <label>{{ _("Почта") }}
      <input type="email" name="email" value="{{ email or '' }}" required autocomplete="email">
    </label>
    <label>{{ _("Телефон") }}
      <input type="tel" name="phone" value="{{ phone or '' }}" autocomplete="tel" placeholder="+7 700 000 00 00">
    </label>
    <label>{{ _("Пароль") }}
      <input type="password" name="password" required minlength="8" autocomplete="new-password">
      <span class="hint">{{ _("Не короче 8 символов") }}</span>
    </label>
    <label class="radio consent"><input type="checkbox" name="consent" value="yes" required> {{ _("Принимаю пользовательское соглашение и даю согласие на обработку персональных данных") }}</label>
    <p class="hint"><a class="under" href="{{ lp }}/terms/">{{ _("Пользовательское соглашение") }}</a> · <a class="under" href="{{ lp }}/privacy/">{{ _("Политика конфиденциальности") }}</a></p>
    <button class="btn" type="submit">{{ _("Создать аккаунт") }}</button>
  </form>
  <p class="muted">{{ _("Уже есть аккаунт?") }} <a class="under" href="/login/?next={{ next }}">{{ _("Войти") }}</a></p>
</section>
{% endblock %}
