# fly launch --no-deploy was used; see README "Deploy".
app = "food-delivery-api"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  ENV = "prod"
  PORT = "8000"
  # CORS_ORIGINS is a secret (empty allowlist by default). App refuses CORS=* in prod.

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

[[http_service.checks]]
  interval = "15s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"
  path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
